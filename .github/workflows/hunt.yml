name: Chasse appartements Marseille

on:
  schedule:
    - cron: "0 * * * *"        # toutes les heures (UTC ; léger retard possible en heure de pointe)
  workflow_dispatch: {}          # bouton "Run workflow" pour tester à la demande

permissions:
  contents: write                # pour committer state/seen.json

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache navigateurs (Playwright / Camoufox)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
            ~/.mozilla/camoufox
          key: browsers-${{ runner.os }}-v1

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Navigateurs furtifs (idempotent ; rapide si le cache est chaud)
          scrapling install || true

      - name: Lancer le chasseur
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          JINKA_COOKIE: ${{ secrets.JINKA_COOKIE }}
          SCRAPER_HEADLESS: "true"
        run: python scraper/main.py

      - name: Sauvegarder l'état (dédoublonnage)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --quiet --cached; then
            echo "Rien à committer."; exit 0
          fi
          git commit -m "chore: maj seen.json [skip ci]"
          # Push robuste : rebase sur l'éventuel remote en avance, avec quelques essais.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 3
          done
          echo "Push échoué après plusieurs essais" >&2; exit 1
